<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070711" />
    <meta name="description" content="Elige tu experiencia en Festholic: asistente, promotor o media partner." />
    <title>Festholic | Elige tu experiencia</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20260614-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260614-1" />
    <link rel="stylesheet" href="styles.css?v=2026082905" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => window.lucide?.createIcons?.());
    </script>
  </head>
  <body class="experience-choice-body">
    <main class="experience-choice" aria-label="Elegir experiencia">
      <section class="experience-choice__panel">
        <img class="experience-choice__full-logo" src="img/logo/festholic.png" alt="Festholic" />

        <div class="experience-choice__brand">
          <strong>FEST<span>HOLIC</span></strong>
          <small>El espacio para tus eventos</small>
        </div>

        <div class="experience-choice__intro">
          <h1>Elige tu experiencia</h1>
          <p>Selecciona el espacio que mejor se adapta a tu trabajo.</p>
        </div>

        <nav class="choice-option-list" aria-label="Opciones de experiencia">
          <a class="choice-option choice-option--main" href="fan.html" aria-label="Entrar como asistente">
            <span class="choice-option__icon"><i data-lucide="sparkles"></i></span>
            <span class="choice-option__text">
              <strong>Asistente</strong>
              <small>Mis eventos y entradas guardadas.</small>
            </span>
            <i class="choice-option__arrow" data-lucide="arrow-right"></i>
          </a>

          <a class="choice-option" href="index.html" aria-label="Entrar como promotor">
            <span class="choice-option__icon"><i data-lucide="ticket-check"></i></span>
            <span class="choice-option__text">
              <strong>Promotor</strong>
              <small>Ventas e inventario.</small>
            </span>
            <i class="choice-option__arrow" data-lucide="arrow-right"></i>
          </a>

          <a class="choice-option" href="media.html" aria-label="Entrar como media partner">
            <span class="choice-option__icon"><i data-lucide="megaphone"></i></span>
            <span class="choice-option__text">
              <strong>Media</strong>
              <small>Contenido y campañas.</small>
            </span>
            <i class="choice-option__arrow" data-lucide="arrow-right"></i>
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
